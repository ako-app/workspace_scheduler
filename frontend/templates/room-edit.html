{% extends "base.html" %}

{% block title %}
会議室編集 | 会議室予約システム
{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="text-center mb-4">会議室を編集する</h1>

        <div
            id="error-message"
            class="text-danger mb-3"
            role="alert"
        ></div>

        <!-- data-room-id を付与しておくとJSでのAPIリクエストがスムーズになります -->
        <form id="room-edit-form" data-room-id="{{ room_id }}">
            <div class="mb-3">
                <label for="room-name" class="form-label">
                    会議室名
                </label>

                <input
                    type="text"
                    id="room-name"
                    name="room-name"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="capacity" class="form-label">
                    定員
                </label>

                <input
                    type="number"
                    id="capacity"
                    name="capacity"
                    class="form-control"
                    min="1"
                    step="1"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                編集する
            </button>
        </form>
    </div>
</section>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', path='/js/room-edit.js') }}"></script>
{% endblock %}
