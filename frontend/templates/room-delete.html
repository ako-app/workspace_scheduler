{% extends "base.html" %}

{% block title %}
会議室削除 | 会議室予約システム
{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="text-center mb-4">会議室を削除する</h1>

        <div
            id="error-message"
            class="text-danger  text-center mb-3 w-100"
            role="alert"
        ></div>

        <form id="room-delete-form" data-room-id="{{ room_id }}">
            <div class="mb-3">
                <label for="room-name" class="form-label">
                    会議室名
                </label>

                <input
                    type="text"
                    id="room-name"
                    name="room-name"
                    class="form-control"
                    readonly
                >
            </div>

            <div class="mb-4">
                <label for="capacity" class="form-label">
                    定員
                </label>

                <input
                    type="number"
                    id="capacity"
                    name="capacity"
                    class="form-control"
                    min="1"
                    step="1"
                    readonly
                >
            </div>

            <button
                type="submit"
                class="btn btn-danger w-100"
            >
                削除する
            </button>

            <a
               href="/room"
               class="btn btn-secondary w-100 mt-3"
            >
               キャンセル
            </a>
        </form>
    </div>
</section>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', path='/js/room-delete.js') }}"></script>
{% endblock %}
