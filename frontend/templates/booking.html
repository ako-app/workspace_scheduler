{% extends "base.html" %}

{% block title %}
予約一覧 | 会議室予約システム
{% endblock %}

{% block content %}
<section class="mb-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>予約一覧</h1>

        <a href="/booking/new" class="btn btn-primary">
            予約を登録する
        </a>
    </div>

    <div
        id="error-message"
        class="text-danger text-center mb-3"
        role="alert"
    ></div>

    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead>
                <tr>
                    <th scope="col">予約ID</th>
                    <th scope="col">会議室ID</th>
                    <th scope="col">予約日時</th>
                    <th scope="col">予約人数</th>
                    <th scope="col">操作</th>
                </tr>
            </thead>

            <tbody id="booking-list">
                <!-- JavaScriptで予約一覧を表示 -->
            </tbody>
        </table>
    </div>
</section>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', path='/js/booking.js') }}"></script>
{% endblock %}
