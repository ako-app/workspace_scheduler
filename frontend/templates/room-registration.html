{% extends "base.html" %}

{% block title %}
会議室登録 | 会議室予約システム
{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="text-center mb-4">会議室を登録する</h1>

        <div
            id="error-message"
            class="text-danger mb-3"
            role="alert"
        ></div>

        <form id="room-registration-form">
            <div class="mb-3">
                <label for="room-name" class="form-label">
                    会議室名
                </label>

                <input
                    type="text"
                    id="room-name"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="capacity" class="form-label">
                    定員
                </label>

                <input
                    type="number"
                    id="capacity"
                    class="form-control"
                    min="1"
                    step="1"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                登録する
            </button>
        </form>
    </div>
</section>
{% endblock %}

{% block script %}
<script src="{{ url_for('static', path='/js/room-registration.js') }}"></script>
{% endblock %}
