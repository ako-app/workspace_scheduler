{% extends "base.html" %}

{% block title %}
ログイン | 会議室予約システム
{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <h1 class="text-center mb-4">ログイン</h1>

        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label">
                    ユーザー名
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    パスワード
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div
                id="error-message"
                class="text-danger mb-3"
                role="alert"
                aria-live="polite"
            ></div>

            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                ログイン
            </button>
        </form>

        <p class="text-center mt-3">
            アカウントをお持ちでない方は
            <a href="/register">ユーザー登録</a>
        </p>
    
    </div>


</section>

{% endblock %}

{% block script %}
<script src="{{url_for('static', path='/js/login.js')}}"></script>
{% endblock %}
